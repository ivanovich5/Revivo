<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="270" viewBox="0 0 1280 270" role="img" aria-labelledby="title desc"><title id="title">Cómo funciona REVIVO</title><desc id="desc">Uno: copia protegida. Dos: búsqueda y revisión. Tres: guardar la selección en la computadora.</desc><rect width="1280" height="270" rx="16" fill="#15132e"/>
<g font-family="sans-serif"><g transform="translate(24 24)"><rect width="384" height="222" rx="10" fill="#1e1b45" stroke="#7166b6"/><text x="24" y="48" fill="#f0997b" font-size="28" font-family="monospace">01</text><text x="24" y="93" fill="#eeedfe" font-size="23" font-weight="bold">Copia protegida</text><text x="24" y="134" fill="#c6c2e8" font-size="18">Lee la USB y crea una imagen</text><text x="24" y="162" fill="#c6c2e8" font-size="18">en otro disco para trabajar</text><text x="24" y="190" fill="#c6c2e8" font-size="18">sobre esa copia.</text></g>
<text x="424" y="146" fill="#f0997b" font-size="25" text-anchor="middle">›</text>
<g transform="translate(448 24)"><rect width="384" height="222" rx="10" fill="#1e1b45" stroke="#7166b6"/><text x="24" y="48" fill="#f0997b" font-size="28" font-family="monospace">02</text><text x="24" y="93" fill="#eeedfe" font-size="23" font-weight="bold">Busca y revisa</text><text x="24" y="134" fill="#c6c2e8" font-size="18">Explora los archivos encontrados.</text><text x="24" y="162" fill="#c6c2e8" font-size="18">Abre una vista previa y marca</text><text x="24" y="190" fill="#c6c2e8" font-size="18">lo que quieres conservar.</text></g>
<text x="848" y="146" fill="#f0997b" font-size="25" text-anchor="middle">›</text>
<g transform="translate(872 24)"><rect width="384" height="222" rx="10" fill="#1e1b45" stroke="#7166b6"/><text x="24" y="48" fill="#f0997b" font-size="28" font-family="monospace">03</text><text x="24" y="93" fill="#eeedfe" font-size="23" font-weight="bold">Guarda tu selección</text><text x="24" y="134" fill="#c6c2e8" font-size="18">Elige un destino en tu equipo.</text><text x="24" y="162" fill="#c6c2e8" font-size="18">Los archivos se organizan</text><text x="24" y="190" fill="#c6c2e8" font-size="18">en carpetas por tipo.</text></g></g></svg>